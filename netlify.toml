# =============================================================================
# Netlify Configuration – Outfit Avenue
# =============================================================================

# ── Build Settings ────────────────────────────────────────────────────────────
[build]
  command         = "npm run build"
  publish         = "dist"
  # Node version explicitly set for reproducible builds
  environment     = { NODE_VERSION = "20" }

# ── Security Headers ──────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking
    X-Frame-Options             = "DENY"
    # Prevent MIME type sniffing
    X-Content-Type-Options      = "nosniff"
    # Enable XSS protection (legacy browsers)
    X-XSS-Protection            = "1; mode=block"
    # Enforce HTTPS on all connections
    Strict-Transport-Security   = "max-age=31536000; includeSubDomains; preload"
    # Referrer policy: send origin only on cross-origin requests
    Referrer-Policy             = "strict-origin-when-cross-origin"
    # Permissions policy: restrict sensitive browser APIs
    Permissions-Policy          = "camera=(), microphone=(), geolocation=(), payment=(self)"
    # Content Security Policy
    Content-Security-Policy     = "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none';"

# ── Long-lived Cache for Hashed Static Assets ─────────────────────────────────
# Vite outputs content-hashed filenames (e.g. index-Abc123.js), so these
# can be cached for 1 year safely. The hash changes whenever content changes.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── No-cache for the HTML entry point ─────────────────────────────────────────
# index.html must never be cached so users always get the latest app shell
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# ── Cache for favicon ─────────────────────────────────────────────────────────
[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
